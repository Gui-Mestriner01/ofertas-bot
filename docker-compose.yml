# ofertas-bot - MySQL + Adminer
# 30/10/2026
# Porta 3307 de proposito: evita conflito com XAMPP/MySQL ja instalado.
# Senhas vem do arquivo .env (copie de .env.example).

services:
  mysql:
    image: mysql:8.0
    container_name: ofertas_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ofertas_bot
      MYSQL_USER: ofertas
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # scripts rodam em ordem alfabetica no PRIMEIRO boot do volume
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ofertas_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
